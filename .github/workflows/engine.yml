name: engine

on:
  push:
    paths: ["engine/**", "content/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "content/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

jobs:
  jvm-android:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tz
          POSTGRES_PASSWORD: tz
          POSTGRES_DB: tz
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tz" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TZ_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/tz?user=tz&password=tz
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build server, shared (JVM) and Android app, run tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :shared:jvmTest :server:test :androidApp:testDebugUnitTest :androidApp:assembleDebug 2>&1 | tee build.log
      - name: Server image (as Railway builds it)
        run: |
          set -o pipefail
          docker build -f Dockerfile -t tz-server .. 2>&1 | tee build.log | tail -5
      - name: Server image starts and answers
        run: |
          docker run -d --name tz --network host -e DATABASE_URL="postgres://tz:tz@localhost:5432/tz" -e PORT=8099 tz-server
          for i in $(seq 1 60); do curl -sf localhost:8099/api/health && break; sleep 1; done
          curl -sf localhost:8099/api/locations/_begin | head -c 300; echo
          docker logs tz 2>&1 | tail -20 > build.log
          curl -sf localhost:8099/api/health
      - name: Report errors
        if: failure()
        run: python3 ci/annotate.py build.log "$GITHUB_WORKSPACE"
      - name: Content problems
        if: success()
        run: |
          python3 - <<'PY'
          import glob, re
          text = "".join(open(f, errors="replace").read() for f in glob.glob("server/build/test-results/test/*.xml") + glob.glob("androidApp/build/test-results/testDebugUnitTest/*.xml"))
          suites = re.findall(r'<testsuite name="([^"]+)" tests="(\d+)" skipped="(\d+)" failures="(\d+)"', text)
          summary = ", ".join(f"{n.split('.')[-1]} {t} (skipped {sk}, failed {f})" for n, t, sk, f in suites)
          if "skipping" in text: summary += " — DATABASE TESTS SKIPPED"
          print("::notice title=Tests::" + summary)
          m = re.search(r"content problems: (\d+)\n((?:  .*\n){0,30})", text)
          if m:
              body = ("content problems: " + m.group(1) + "\n" + m.group(2)).replace("%", "%25").replace("\n", "%0A")
              print("::notice title=Content::" + body)
          PY
      - name: Screens
        if: success()
        run: |
          pip install -q pillow
          python3 ci/screens.py androidApp/build/screens
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: engine/androidApp/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared XCFramework and iOS tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :shared:iosSimulatorArm64Test :shared:assembleSharedDebugXCFramework 2>&1 | tee build.log
      - name: iOS app (simulator build)
        run: |
          set -o pipefail
          brew install xcodegen
          cd iosApp && xcodegen
          xcodebuild -project Tz.xcodeproj -scheme Tz -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | tail -40
      - name: iOS app for a device, unsigned (IPA to sign yourself, e.g. with Sideloadly)
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project Tz.xcodeproj -scheme Tz -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../build.log | tail -20
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Tz.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../AmuletDrakona-unsigned.ipa Payload)
          ls -lh build/AmuletDrakona-unsigned.ipa
      - name: Report errors
        if: failure()
        run: python3 ci/annotate.py build.log "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-unsigned-ipa
          path: engine/iosApp/build/AmuletDrakona-unsigned.ipa
