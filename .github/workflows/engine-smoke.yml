name: engine-smoke

# After a push to main, wait until the VPS serves the new server (engine-deploy
# loads it after the engine workflow is green) and walk the live API once
# (engine/ci/smoke.py). The expected version is the last commit that touched
# engine/ or content/ (GET /api/version reports the running commit).
on:
  push:
    branches: [main]
    paths: ["engine/server/**", "engine/shared/**", "content/**", "engine/ci/smoke.py", ".github/workflows/engine-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Smoke test of 217-177-74-66.sslip.io (VPS)
        run: |
          export EXPECT_SHA=$(git log -1 --first-parent --format=%H -- engine content)
          python3 engine/ci/smoke.py https://217-177-74-66.sslip.io
