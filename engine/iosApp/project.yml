# Xcode project for the iOS app, generated with XcodeGen:
#   cd engine && ./gradlew :shared:assembleSharedDebugXCFramework
#   cd iosApp && xcodegen && open Tz.xcodeproj
name: Tz
options:
  bundleIdPrefix: ru.territoriyazla
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SERVER_URL: "https://217-177-74-66.sslip.io"   # local: http://localhost:8080
targets:
  Tz:
    type: application
    platform: iOS
    sources:
      - Tz
      # All the game's pictures ship inside the app (owner 02.10), as the «art» folder.
      - path: ../../content/art
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/Shared.xcframework
        embed: false
    info:
      path: Tz/Info.plist
      properties:
        CFBundleDisplayName: "Амулет дракона"
        UILaunchScreen: {}
        # Fonts of the design system (tz.shared.Design.Fonts, SIL OFL: engine/licenses).
        UIAppFonts:
          - alegreya_regular.ttf
          - alegreya_medium.ttf
          - alegreya_bold.ttf
          - alegreya_italic.ttf
          - alegreya_sans_regular.ttf
          - alegreya_sans_medium.ttf
          - alegreya_sans_bold.ttf
          - alegreya_sans_sc_medium.ttf
          - alegreya_sans_sc_bold.ttf
          - cormorant_sc_semibold.ttf
          - cormorant_sc_bold.ttf
        ServerURL: $(SERVER_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.territoriyazla.app
        # The shared framework is built for Apple Silicon simulators only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
