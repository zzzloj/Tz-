name: mmo

# The MMO on Open MMORPG / MMORPG KIT (owner 07.10, mmo/README.md): builds the Linux server and the
# Android client in GameCI's Unity images, run directly so that the editor log can be read: its
# errors become annotations of the run (the log itself cannot be fetched from the session).
# Same Unity licence secrets as unity.yml (UNITY_LICENSE).
on:
  push:
    paths: ["mmo/**", ".gitmodules", ".github/workflows/mmo.yml", "deploy/vps/mmo/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: linux-il2cpp-3
            method: MmoBuild.BuildServer
            out: Server
          - image: android-3
            method: MmoBuild.BuildAndroid
            out: Android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          large-packages: false

      - uses: actions/cache@v4
        with:
          path: mmo/Library
          key: mmo-library-${{ matrix.out }}-${{ hashFiles('mmo/Packages/manifest.json', 'mmo/ProjectSettings/ProjectVersion.txt', '.gitmodules') }}
          restore-keys: mmo-library-${{ matrix.out }}-

      - name: Make the kit compile on our Unity version
        run: python3 mmo/tools/patch_kit.py

      - name: Build (server, in the Unity image directly)
        if: matrix.out == 'Server'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' mmo/ProjectSettings/ProjectVersion.txt)
          docker run --rm -v "$PWD":/w -w /w -e UNITY_LICENSE "unityci/editor:ubuntu-$version-${{ matrix.image }}" bash -c '
            mkdir -p /root/.local/share/unity3d/Unity
            printf "%s" "$UNITY_LICENSE" > /root/.local/share/unity3d/Unity/Unity_lic.ulf
            unity-editor -batchmode -nographics -quit -projectPath /w/mmo -buildTarget Linux64 \
              -executeMethod ${{ matrix.method }} -logFile /w/unity.log
            echo "exit $?" >> /w/unity.log'
          tail -1 unity.log | grep -q "exit 0"

      # Android through GameCI's builder: it sets up the Android SDK and JDK the editor needs
      # (run directly, the editor said "build target was unsupported").
      - name: Build (Android, GameCI)
        if: matrix.out == 'Android'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: mmo
          targetPlatform: Android
          unityVersion: auto
          buildMethod: ${{ matrix.method }}
          customParameters: -logFile /github/workspace/unity.log
          allowDirtyBuild: true   # the kit is patched in place (mmo/tools/patch_kit.py)
          versioning: None

      - name: Errors of the Unity log as annotations
        if: always()
        run: |
          if [ -f mmo/build/editor-log.txt ]; then
            text=$(grep -vE "^\s*$" mmo/build/editor-log.txt | grep -B2 -A8 -E "^\[(Error|Exception|Assert)\]" | head -80 | cut -c1-260 | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$text" ] && echo "::notice title=editor errors ${{ matrix.out }}::$text"
          fi
          [ -f unity.log ] || { echo "::warning::no unity.log"; exit 0; }
          grep -E "error CS|[Ee]rror:|Exception|Failed|FAILURE|What went wrong|Unable|Cannot|not found|Build (Android|StandaloneLinux64):|Gradle|SDK|NDK|JDK" unity.log | grep -v Licensing | sort | uniq -c | sort -rn | head -45 \
            | while IFS= read -r line; do echo "::error title=unity ${{ matrix.out }}::$(echo "$line" | cut -c1-900)"; done
          grep -nE "MmoBuild|executeMethod|[Ss]witch|BuildPlayer|Exiting|Aborting|abort|Android SDK|AndroidPlayer|returned|exit code" unity.log | grep -v Licensing | tail -25 \
            | while IFS= read -r line; do echo "::warning title=steps ${{ matrix.out }}::$(echo "$line" | cut -c1-600)"; done
          # the 40 lines before the build's stack trace, as one annotation (GitHub keeps only 10 per kind and step)
          n=$(grep -n "start building target\|Validating game data" unity.log | tail -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            text=$(tail -n +"$n" unity.log | grep -vE "^\s*$|Start importing|Licensing|^Unity|^UnityEditor|^System\.|ExtractStackTrace|DebugLogHandler|Logger:Log|Debug:Log" | head -70 | cut -c1-260 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=building ${{ matrix.out }}::$text"
          fi
          tail -8 unity.log | while IFS= read -r line; do echo "::notice title=tail ${{ matrix.out }}::$(echo "$line" | cut -c1-500)"; done

      - uses: actions/upload-artifact@v4
        with:
          name: tz-mmo-${{ matrix.out }}
          path: mmo/build/${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14

  # On main: the server build goes to the VPS (deploy/vps/mmo) and starts; its first log lines and
  # memory become annotations of the run.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tz-mmo-Server
          path: server
      - name: SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload and restart
        run: |
          chmod +x server/tz-mmo-server.x86_64
          tar czf server.tgz -C server .
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p ~/tz-mmo/data ~/tz-mmo/server'
          scp server.tgz deploy/vps/mmo/Dockerfile deploy/vps/mmo/docker-compose.yml "$VPS_USER@$VPS_HOST:~/tz-mmo/"
          ssh "$VPS_USER@$VPS_HOST" 'set -e; cd ~/tz-mmo
            docker compose down || true
            rm -rf server && mkdir server && tar xzf server.tgz -C server && rm server.tgz
            docker compose up -d --build'
      - name: First minutes of the server, as annotations
        if: always()
        run: |
          sleep 75
          ssh "$VPS_USER@$VPS_HOST" 'cd ~/tz-mmo; docker compose ps; docker stats --no-stream --format "{{.Name}} {{.MemUsage}} {{.CPUPerc}}"; ps -eo rss,args | grep tz-mmo-server | grep -v grep | awk "{printf \"%d MB %s\\n\", \$1/1024, \$0}" | cut -c1-200; free -m' > state.txt 2>&1 || true
          ssh "$VPS_USER@$VPS_HOST" 'cd ~/tz-mmo; docker compose logs --no-color --tail 400' > log.txt 2>&1 || true
          echo "::notice title=state::$(cut -c1-300 state.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=errors::$(grep -iE "error|exception|fail|cannot|unable" log.txt | grep -v "Licensing" | sort | uniq -c | sort -rn | head -40 | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=log::$(grep -vE "^\s*$" log.txt | grep -iE "start|listen|port|server|map|spawn|database|login|central" | tail -60 | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')"
