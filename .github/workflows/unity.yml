name: unity

# The Unity client (prototype, owner 06.10): checks its C# against stubs on every change and,
# when the Unity licence secrets are set, builds an Android APK with GameCI.
# Secrets (Unity Personal, free): UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE — the text of the
# .ulf file Unity Hub writes after signing in and activating Personal
#   (Windows: C:\ProgramData\Unity\Unity_lic.ulf, macOS: /Library/Application Support/Unity/Unity_lic.ulf).
on:
  push:
    paths: ["unity/**", "content/art/**", ".github/workflows/unity.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile check (C# against stubs)
        run: dotnet build unity/tools/check -nologo -v q

      - name: Licence
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning title=Unity build skipped::Set UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (see the top of .github/workflows/unity.yml)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Free disk space (the Android image of Unity is large)
        if: env.SKIP != '1'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          large-packages: false

      - name: Pictures and fonts
        if: env.SKIP != '1'
        run: |
          pip install -q pillow
          python3 unity/tools/prepare.py

      - uses: actions/cache@v4
        if: env.SKIP != '1'
        with:
          path: unity/Library
          key: unity-library-android-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-android-

      - name: Build the APK
        if: env.SKIP != '1'
        uses: game-ci/unity-builder@v4
        with:
          projectPath: unity
          targetPlatform: Android
          unityVersion: auto
          buildMethod: BuildScript.BuildAndroid

      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with:
          name: amulet-unity-apk
          path: |
            unity/build/Android/*.apk
            build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
