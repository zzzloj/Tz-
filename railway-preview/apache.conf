ServerName localhost
<Directory /data/game>
    Options +FollowSymLinks -Indexes
    AllowOverride None
    AuthType Basic
    AuthName "Territory of Evil private preview"
    AuthUserFile /run/legacy-preview.htpasswd
    Require valid-user
</Directory>

# Included PHP data, database configuration, logs, and source archives must
# never be downloaded as static files, even after authentication.
<LocationMatch "(\.(dat|ssp|inc|sql|txt|log|zip|bak|lock)$|\.tmp\.)">
    Require all denied
</LocationMatch>
<LocationMatch "^/(forum|sms|lib)/">
    Require all denied
</LocationMatch>
RedirectMatch 302 ^/$ /1/g.php
