name: engine-smoke

# After a push to main, wait until Railway serves the new server and walk the
# live API once (engine/ci/smoke.py). Railway redeploys tz-engine only for
# changes in engine/ or content/, so the expected version is the last commit
# that touched them (GET /api/version reports the running commit).
on:
  push:
    branches: [main]
    paths: ["engine/server/**", "engine/shared/**", "content/**", "engine/ci/smoke.py", ".github/workflows/engine-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Smoke test of tz-engine-production.up.railway.app
        run: |
          export EXPECT_SHA=$(git log -1 --format=%H -- engine content)
          python3 engine/ci/smoke.py https://tz-engine-production.up.railway.app
