ServerName localhost
<Directory /data/game>
    Options +FollowSymLinks -Indexes
    AllowOverride None
    AuthType Basic
    AuthName "Territory of Evil private preview"
    AuthUserFile /run/legacy-preview.htpasswd
    Require valid-user
</Directory>

# Included PHP data, database configuration, logs, and source archives must
# never be downloaded as static files, even after authentication.
<LocationMatch "(\.(dat|ssp|inc|sql|txt|log|zip|bak|lock)$|\.tmp\.)">
    Require all denied
</LocationMatch>
# /2/ is the second world, a copy of the engine in game/2. The game runs as a
# single world for now (see README), so it is closed rather than deleted.
<LocationMatch "^/(forum|sms|lib|2)/">
    Require all denied
</LocationMatch>
RedirectMatch 302 ^/$ /1/g.php
